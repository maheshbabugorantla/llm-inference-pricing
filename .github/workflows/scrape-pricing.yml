name: Scrape Pricing

on:
  schedule:
    # 06:17 UTC daily — offset to avoid top-of-hour runner contention
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: scrape-pricing
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --group dev

      - name: Add venv to PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Write GCP service account key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "$GCP_SA_KEY" > "${RUNNER_TEMP}/gcp-sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/gcp-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Scrape all providers
        env:
          DJANGO_SETTINGS_MODULE: pricing_dashboard.settings
          # Placeholder DB env vars — dump_pricing never queries the DB.
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: pricing
          DB_USER: postgres
          DB_PASSWORD: postgres
          REDIS_URL: redis://localhost:6379/0
          # AWS credentials (optional — scraper skipped if absent)
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: python manage.py dump_pricing --provider all

      - name: Commit updated artifacts
        run: |
          git config user.name "pricing-bot"
          git config user.email "pricing-bot@users.noreply.github.com"
          if git status --porcelain data/pricing/ | grep -q .; then
            git add data/pricing/
            git commit -m "data(pricing): refresh $(date -u +%Y-%m-%d) snapshots"
            git push origin HEAD:main
          else
            echo "No pricing data changed."
          fi
