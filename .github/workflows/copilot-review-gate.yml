name: Copilot Review Gate

# Runs on every PR push and whenever any review is submitted.
#
# Behaviour:
#   pull_request event  → requests Copilot review; passes if no review yet
#                         (review is async — Copilot responds in its own time)
#   pull_request_review → re-evaluates severity when any review is submitted;
#                         fails only if Copilot found HIGH or MEDIUM issues
#
# This means the gate is informational until Copilot responds, then enforcing.
# Add "Copilot review severity gate" as a required status check in branch protection.
#
# Prerequisites: enable "Copilot code review" in repository Settings → Copilot.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write  # write is required to add a reviewer via the API

concurrency:
  group: copilot-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  severity-gate:
    name: Copilot review severity gate
    runs-on: ubuntu-latest

    steps:
      - name: Request Copilot review
        # Only runs on PR push events; skipped when re-triggered by a submitted review.
        # Uses the REST API directly — more reliable than "gh pr edit" for bot reviewers.
        # A warning is emitted (not a failure) when Copilot code review is not enabled;
        # the severity check below will still run and pass if no review exists yet.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '{"reviewers":["copilot-pull-request-reviewer"]}' \
            | gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers" \
                --input - \
            && echo "Copilot review requested." \
            || echo "::warning::Could not add Copilot as reviewer. Enable 'Copilot code review' in repository Settings → Copilot, then re-run this workflow."

      - name: Evaluate Copilot review severity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # GitHub uses two different logins for the same bot across endpoints:
          #   reviews API  → "copilot-pull-request-reviewer[bot]"
          #   comments API → "Copilot"
          REVIEW_BOT="copilot-pull-request-reviewer[bot]"
          COMMENT_BOT="Copilot"

          # ── 1. Check whether a Copilot review exists ──────────────────────
          REVIEW_COUNT=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            --jq "[.[] | select(.user.login == \"${REVIEW_BOT}\")] | length")

          if [ "${REVIEW_COUNT}" -eq 0 ]; then
            # No review yet — this is expected on the initial PR push because
            # Copilot reviews asynchronously. The gate passes here so the PR
            # is not permanently blocked; it re-evaluates via pull_request_review
            # when Copilot submits its review.
            echo "::notice::No Copilot review yet. The gate will re-evaluate automatically when Copilot submits its review."
            exit 0
          fi

          echo "Copilot reviews found: ${REVIEW_COUNT}"

          # ── 2. Count HIGH severity inline comments ─────────────────────────
          HIGH=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments" \
            --jq "[.[] \
              | select(.user.login == \"${COMMENT_BOT}\") \
              | select(.body | test(\"\\\\[SEVERITY: HIGH\\\\]\"; \"i\")) \
            ] | length")

          # ── 3. Count MEDIUM severity inline comments ───────────────────────
          MEDIUM=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments" \
            --jq "[.[] \
              | select(.user.login == \"${COMMENT_BOT}\") \
              | select(.body | test(\"\\\\[SEVERITY: MEDIUM\\\\]\"; \"i\")) \
            ] | length")

          # ── 4. Count LOW severity inline comments (informational only) ─────
          LOW=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments" \
            --jq "[.[] \
              | select(.user.login == \"${COMMENT_BOT}\") \
              | select(.body | test(\"\\\\[SEVERITY: LOW\\\\]\"; \"i\")) \
            ] | length")

          echo "Severity counts — HIGH: ${HIGH}  MEDIUM: ${MEDIUM}  LOW: ${LOW}"

          if [ "${HIGH}" -gt 0 ] || [ "${MEDIUM}" -gt 0 ]; then
            echo "::error::Merge blocked: ${HIGH} HIGH and ${MEDIUM} MEDIUM severity issues must be resolved."
            echo "::notice::${LOW} LOW severity issue(s) can be merged as-is."
            exit 1
          fi

          echo "✅ Copilot review gate passed — ${LOW} LOW severity issue(s), no HIGH or MEDIUM."
