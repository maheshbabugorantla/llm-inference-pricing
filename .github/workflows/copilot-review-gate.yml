name: Copilot Review Gate

# Evaluates Copilot code review severity on every PR push and review submission.
#
# Behaviour:
#   pull_request event  → fails if no Copilot review exists yet (merge blocked
#                         until Copilot responds); Copilot submits asynchronously
#   pull_request_review → re-evaluates; passes only if no HIGH or MEDIUM issues
#
# Copilot reviews are triggered automatically by the repository setting:
#   Settings → Copilot → Code review → "Automatically review pull requests"
# No API call is needed from this workflow — GitHub handles the trigger.
#
# Add "Copilot review severity gate" as a required status check in branch protection.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: read

concurrency:
  group: copilot-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  severity-gate:
    name: Copilot review severity gate
    runs-on: ubuntu-latest

    steps:
      - name: Evaluate Copilot review severity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # reviews API uses "copilot-pull-request-reviewer[bot]" as user.login
          REVIEW_BOT="copilot-pull-request-reviewer[bot]"

          # ── 1. Find the most recent Copilot review ────────────────────────
          # Evaluating only the latest review means fixed issues from earlier
          # reviews don't permanently block the gate once Copilot re-reviews.
          LATEST_REVIEW_ID=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            --jq "[.[] | select(.user.login == \"${REVIEW_BOT}\")] \
                  | sort_by(.submitted_at) | last | .id")

          if [ -z "${LATEST_REVIEW_ID}" ] || [ "${LATEST_REVIEW_ID}" = "null" ]; then
            echo "::error::No Copilot review submitted yet — merge is blocked until Copilot reviews this PR."
            exit 1
          fi

          echo "Latest Copilot review ID: ${LATEST_REVIEW_ID}"

          # ── 2. Count severity from the latest review only ─────────────────
          # Uses the review-specific endpoint — no user.login filter needed
          # since the scope is already restricted to one review.
          HIGH=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews/${LATEST_REVIEW_ID}/comments" \
            --jq "[.[] | select(.body | test(\"\\\\[SEVERITY: HIGH\\\\]\"; \"i\"))] | length")

          # ── 3. Count MEDIUM severity ───────────────────────────────────────
          MEDIUM=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews/${LATEST_REVIEW_ID}/comments" \
            --jq "[.[] | select(.body | test(\"\\\\[SEVERITY: MEDIUM\\\\]\"; \"i\"))] | length")

          # ── 4. Count LOW severity (informational only) ─────────────────────
          LOW=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews/${LATEST_REVIEW_ID}/comments" \
            --jq "[.[] | select(.body | test(\"\\\\[SEVERITY: LOW\\\\]\"; \"i\"))] | length")

          echo "Severity counts — HIGH: ${HIGH}  MEDIUM: ${MEDIUM}  LOW: ${LOW}"

          if [ "${HIGH}" -gt 0 ] || [ "${MEDIUM}" -gt 0 ]; then
            echo "::error::Merge blocked: ${HIGH} HIGH and ${MEDIUM} MEDIUM severity issues must be resolved."
            echo "::notice::${LOW} LOW severity issue(s) can be merged as-is."
            exit 1
          fi

          echo "✅ Copilot review gate passed — ${LOW} LOW severity issue(s), no HIGH or MEDIUM."
