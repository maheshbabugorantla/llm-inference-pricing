[project]
name = "llm-inference-pricing"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6.0",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "google-auth>=2.30",
    "boto3>=1.34",
    "sentry-sdk[django]>=2.0",
    "python-json-logger>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "django-stubs[compatible-mypy]>=5.0",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pricing_dashboard", "catalog", "pricing", "seeds"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "TCH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/", ".*/tests/.*"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["celery.*", "celery", "tenacity.*", "tenacity"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sentry_sdk.*", "pythonjsonlogger.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "pricing_dashboard.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pricing_dashboard.settings"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "smoke: slow integration tests against real seeds and live DB (deselect with -m 'not smoke')",
]
