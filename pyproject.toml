[project]
name = "llm-inference-pricing"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6.0",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "google-auth>=2.30",
    "boto3>=1.34",
    "sentry-sdk[django]>=2.0",
    "python-json-logger>=2.0",
    "djangorestframework>=3.17.1",
    "drf-spectacular>=0.29.0",
    "django-cors-headers>=4.9.0",
    "django-filter>=25.2",
]

[dependency-groups]
dev = [
    "coverage>=7.5",
    "factory-boy>=3.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "django-stubs[compatible-mypy]>=5.0",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pricing_dashboard", "catalog", "pricing", "seeds", "api"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "TCH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/", ".*/tests/.*"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["celery.*", "celery", "tenacity.*", "tenacity"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sentry_sdk.*", "pythonjsonlogger.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rest_framework.*", "drf_spectacular.*", "corsheaders.*", "django_filters.*"]
ignore_missing_imports = true
ignore_errors = true

[tool.django-stubs]
django_settings_module = "pricing_dashboard.settings"

[tool.coverage.run]
source = ["catalog", "pricing", "api"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "pricing_dashboard/*",
    "manage.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
